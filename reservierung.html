<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datscha – Reservierung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reservierung.css">

</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="images/logo_image.svg" alt="Datscha – Startseite">
        </a>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">STARTSEITE</a></li>
                <li><a href="menu-appetizer.html" class="nav-link">MENÜ</a></li>
                <li><a href="reservierung.html" class="nav-link active">RESERVIERUNG</a></li>
                <li><a href="ueber-uns.html" class="nav-link">ÜBER UNS</a></li>
                <li><a href="kontakt.html" class="nav-link">KONTAKT</a></li>
            </ul>
        </nav>
    </header>

    <main class="reservation-page">
        <form class="reservation-form" action="reservierung-pruefen.html" method="get">
            
            <div class="form-column guest-details">
                <h1>IHRE RESERVIERUNG</h1>

                <div class="form-group">
                    <label for="guest-name">Name:</label>
                    <input type="text" id="guest-name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="guest-count">Personenanzahl:</label>
                    <select id="guest-count" name="guests" required>
                        <option value="" disabled selected>Bitte wählen</option>
                        <option value="1">1 Person</option>
                        <option value="2">2 Personen</option>
                        <option value="3">3 Personen</option>
                        <option value="4">4 Personen</option>
                        <option value="5">5 Personen</option>
                        <option value="6">6 Personen</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="guest-email">E-Mail-Adresse:</label>
                    <input type="email" id="guest-email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="guest-phone">Telefonnummer (optional):</label>
                    <input type="tel" id="guest-phone" name="phone">
                </div>

                <fieldset class="form-group seating-preference">
                    <legend>Wo möchten Sie sitzen?</legend>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="seating" value="drinnen" checked>
                            <span>Drinnen</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="seating" value="draussen">
                            <span>Draußen</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            
            <div class="form-column date-selection">
                <label class="column-label">Datum:</label>
                <div class="calendar-box">
                    <div class="calendar-header">
                        <button type="button" class="cal-arrow prev" aria-label="Vorheriger Monat">&#9664;</button>
                        <span class="calendar-month">Oktober:</span>
                        <button type="button" class="cal-arrow next" aria-label="Nächster Monat">&#9654;</button>
                    </div>

                    <div class="calendar-weekdays">
                        <span>Mo</span>
                        <span>Di</span>
                        <span>Mi</span>
                        <span>Do</span>
                        <span>Fr</span>
                        <span>Sa</span>
                        <span>So</span>
                    </div>

                    <div class="calendar-grid">
                        
                        <span></span>
                        <span></span>
                        <span></span>
                        <button type="button" class="cal-day muted" disabled>1</button>
                        <button type="button" class="cal-day muted" disabled>2</button>
                        <button type="button" class="cal-day muted" disabled>3</button>
                        <button type="button" class="cal-day muted" disabled>4</button>

                        <button type="button" class="cal-day muted" disabled>5</button>
                        <button type="button" class="cal-day muted" disabled>6</button>
                        <button type="button" class="cal-day muted" disabled>7</button>
                        
                        <button type="button" class="cal-day available">8</button>
                        <button type="button" class="cal-day available">9</button>
                        <button type="button" class="cal-day available">10</button>
                        <button type="button" class="cal-day available">11</button>

                        <button type="button" class="cal-day available">12</button>
                        <button type="button" class="cal-day available">13</button>
                        <button type="button" class="cal-day available">14</button>
                        <button type="button" class="cal-day available">15</button>
                        
                        <button type="button" class="cal-day available">16</button>
                        <button type="button" class="cal-day available">17</button>
                        <button type="button" class="cal-day available">18</button>

                        <button type="button" class="cal-day available">19</button>
                        <button type="button" class="cal-day available">20</button>
                        <button type="button" class="cal-day available">21</button>
                        <button type="button" class="cal-day available">22</button>
                        <button type="button" class="cal-day available">23</button>
                        <button type="button" class="cal-day available">24</button>
                        <button type="button" class="cal-day available">25</button>
                        <button type="button" class="cal-day available">26</button>
                        <button type="button" class="cal-day available">27</button>
                        <button type="button" class="cal-day available">28</button>
                        <button type="button" class="cal-day selected">29</button>
                        <button type="button" class="cal-day available">30</button>
                        <button type="button" class="cal-day available">31</button>
                    </div>
                </div>
            </div>

            
            <div class="form-column time-selection">
                <label class="column-label">Uhrzeit:</label>
                <div class="time-box">
                    <button type="button" class="time-arrow up" aria-label="Früher">&#9650;</button>
                    <div class="time-slots">
                        <button type="button" class="time-slot muted disabled">17:00</button>
                        <button type="button" class="time-slot available">17:30</button>
                        <button type="button" class="time-slot selected">18:00</button>
                        <button type="button" class="time-slot muted disabled">18:30</button>
                        <button type="button" class="time-slot available">19:00</button>
                        <button type="button" class="time-slot available">19:30</button>
                    </div>
                    <button type="button" class="time-arrow down" aria-label="Später">&#9660;</button>
                </div>
            </div>

            
            <div class="form-column notes-submission">
                <div class="form-group notes-group">
                    <label for="reservation-notes" class="column-label">Anmerkungen:</label>
                    <textarea id="reservation-notes" name="notes" rows="8"></textarea>
                </div>
                <button type="submit" class="btn btn-green btn-submit">WEITER</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <a href="impressum.html" class="footer-link">IMPRESSUM</a>
        <a href="agb.html" class="footer-link">AGB</a>
    </footer>

</body>
</html>
